name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
  workflow_dispatch:

concurrency:
  group: deploy-odoo19
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    env:
      DEPLOY_DIR: /home/abdmun8/code/hadirapp/odoo-19
    steps:
      - name: Pull & restart
        run: |
          cd "$DEPLOY_DIR"
          git pull --ff-only origin main
          docker compose up -d
          docker compose restart odoo19

      - name: Health check
        run: |
          cd "$DEPLOY_DIR"
          timeout 120 bash -c 'until curl -fsS -o /dev/null http://localhost:10019/web/health; do sleep 10; done'
          docker compose ps
